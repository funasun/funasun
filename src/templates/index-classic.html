<!DOCTYPE html>
<html lang="ja">
<head>
{{HEAD}}
</head>
<!--
  ホーム（情報重視版）。/admin の「ホーム」タブ →「ホームの見せ方」で
  brand（読ませる版・index.html）と切り替わる。中身はどちらも data.json から。

  作りは、作り直す前のホームページに合わせてある：
    1カラム 720px ／ 名前 → ひとこと → News → 各ページへの入口 → 注目
  小さな英字ラベルで区切り、行と行を細い線で仕切るだけ。演出は入れない。
  色だけは他のページ（暗い背景）に合わせている。
-->
<body class="p-home-classic">
<div id="top"></div>
{{NAV}}

<main class="c-wrap">

  <!-- 名乗り。写真は小さく添えるだけ（主役は文字） -->
  <div class="c-portrait">{{C_PORTRAIT}}</div>
  <p class="c-name">船越 温<span class="c-name-en">Tsutsumu Funakoshi</span></p>
  <p class="c-tagline">{{C_TAGLINE}}</p>

{{CAMPFIRE}}

  <!-- News -->
  <section id="news" class="c-block">
    <p class="c-label">News</p>
    <div class="c-rows">
{{C_NEWS}}
    </div>
    <p class="c-more"><a href="archive.html">{{T:index.news.link}}</a></p>
  </section>

  <!-- 各ページへの入口。1行の説明と矢印だけ、というのが元の形 -->
  <section class="c-previews">
{{C_PREVIEWS}}
  </section>

  <!-- Featured（作品） -->
  <section class="c-block">
    <p class="c-label">Featured</p>
    <div class="c-rows">
{{C_WORKS}}
    </div>
    <p class="c-more"><a href="works.html">すべての作品を見る　→</a></p>
  </section>

  <!-- Media -->
  <section class="c-block">
    <p class="c-label">Media</p>
    <div class="c-rows">
{{C_MEDIA}}
    </div>
    <p class="c-more"><a href="press.html">{{T:index.media.link}}</a></p>
  </section>

  <!-- About と連絡先 -->
  <section id="about" class="c-block">
    <p class="c-label">About</p>
    <p class="c-prose">{{C_PROSE}}</p>
    <p class="c-more"><a href="about.html">経歴とタイムライン　→</a>　<a href="contact.html">お問い合わせ　→</a></p>
  </section>

</main>

{{FOOTER}}

<style>
/* 作り直す前のホームページの寸法づかいをそのまま持ってきている
   （720px・小さな英字ラベル・細い罫線・ゆったりした余白）。 */
.c-wrap { max-width: 720px; margin: 0 auto; padding: 5rem 2rem 6rem; box-sizing: border-box; }

.c-portrait { width: 120px; aspect-ratio: 1 / 1; border-radius: 50%; overflow: hidden; border: 1px solid rgba(255,255,255,.14); margin-bottom: 1.8rem; }
.c-portrait img { width: 100%; height: 100%; object-fit: cover; }

.c-name { margin: 0 0 .9rem; font: 400 clamp(2rem, 5vw, 2.8rem)/1.2 'Noto Serif JP', serif; letter-spacing: .02em; }
.c-name-en { display: block; margin-top: .5rem; font: italic 400 .95rem 'EB Garamond', serif; letter-spacing: .06em; color: #9a9aa0; }
.c-tagline { margin: 0 0 4rem; max-width: 520px; font: 400 .95rem/1.9 'Noto Sans JP', sans-serif; color: #cfcfd1; text-wrap: pretty; }

.c-block { margin-bottom: 4rem; }

/* クラウドファンディングの札。文章と widget を横に並べ、狭い画面では縦に */
.c-cf { display: flex; gap: 1.8rem; align-items: center; margin: 0 0 4rem; padding: 1.8rem; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; background: rgba(255,255,255,.02); }
.c-cf-body { flex: 1; min-width: 0; }
.c-cf-h { margin: 0 0 .6rem; font: 400 1.15rem/1.6 'Noto Serif JP', serif; }
.c-cf-note { margin: 0; font: 400 .85rem/1.9 'Noto Sans JP', sans-serif; color: #cfcfd1; text-wrap: pretty; }
.c-cf-frame { flex: none; }
.c-label { margin: 0 0 1.2rem; font: 400 .7rem 'Noto Sans JP', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8a8a8f; }
.c-rows > *:first-child { border-top: 1px solid rgba(255,255,255,.1); }
.c-rows > *:last-child { border-bottom: 1px solid rgba(255,255,255,.1); }
.c-more { margin: 1rem 0 0; font: 400 .8rem 'Noto Sans JP', sans-serif; }
.c-more a { color: var(--accent-text, #adbcff); text-decoration: none; }
.c-more a:hover { opacity: .7; }

/* 1行（日付 ｜ 見出し）。元の .news-item と同じ組み方 */
.c-row { display: grid; grid-template-columns: 90px 1fr; gap: 1.5rem; padding: 1rem 0; border-bottom: 1px solid rgba(255,255,255,.1); text-decoration: none; color: #f4f4f5; transition: opacity .2s ease; }
.c-row:hover { opacity: .6; }
.c-row-date { font: 400 .78rem 'EB Garamond', serif; letter-spacing: .04em; color: #8a8a8f; padding-top: .15rem; }
/* 見出し・カテゴリ・説明はそれぞれ行を変える（span のままだと横に繋がる） */
.c-row-title { display: block; font: 400 .9rem/1.6 'Noto Serif JP', serif; }
.c-row-sub { display: block; margin-top: .3rem; font: 400 .68rem 'Noto Sans JP', sans-serif; letter-spacing: .08em; color: #8a8a8f; }
.c-row-note { display: block; margin-top: .4rem; font: 400 .8rem/1.8 'Noto Sans JP', sans-serif; color: #cfcfd1; }

/* 各ページへの入口。ラベル＋1行＋矢印 */
.c-previews { margin-bottom: 3rem; }
.c-preview { display: flex; align-items: center; gap: 1.2rem; padding: 1.5rem 0; border-top: 1px solid rgba(255,255,255,.1); text-decoration: none; color: #f4f4f5; transition: opacity .2s ease; }
.c-preview:last-child { border-bottom: 1px solid rgba(255,255,255,.1); }
.c-preview:hover { opacity: .6; }
.c-preview-body { flex: 1; min-width: 0; }
/* 写真は brand 版と同じもの（data.json の「柱の背景写真」）。無い柱は文字だけ */
.c-preview-thumb { flex: none; width: 72px; height: 54px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); }
.c-preview-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.c-preview-label { display: block; margin: 0 0 .4rem; font: 400 .7rem 'Noto Sans JP', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8a8a8f; }
.c-preview-text { display: block; margin: 0; font: 400 .88rem/1.7 'Noto Serif JP', serif; color: #cfcfd1; }
.c-preview-arrow { flex: none; font: 400 1.2rem 'EB Garamond', serif; color: #8a8a8f; }

.c-prose { margin: 0; font: 400 .92rem/2.1 'Noto Sans JP', sans-serif; color: #d8d8da; text-wrap: pretty; }

@media (max-width: 700px) {
  .c-wrap { padding: 3.5rem 1.5rem 4.5rem; }
  .c-row { grid-template-columns: 80px 1fr; gap: 1rem; }
  .c-cf { flex-direction: column; align-items: center; }
  .c-cf-body { width: 100%; }
}
</style>
</body>
</html>
