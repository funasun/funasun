<!DOCTYPE html>
<!-- files/index.html — ファイル共有（ギガファイル便ふう）アップロード画面。
     合言葉を知っている人だけがアップロードでき、共有URLが発行される。
     大きいファイルは分割してアップロードするので GB 級も送れる。
     複数選ぶと1つのURLにまとまる（受け取る側は一覧から個別に保存できる）。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイル共有 — 船越温</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060608">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Noto+Serif+JP:wght@600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --accent: #6f8cff; --accent-text: #adbcff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #060608; color: #f4f4f5; -webkit-font-smoothing: antialiased; font-family: 'Noto Sans JP', sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 8vh 24px 14vh; }
  .eyebrow { margin: 0 0 12px; font: 500 12px 'EB Garamond', serif; letter-spacing: .4em; text-transform: uppercase; color: rgba(244,244,245,.84); }
  h1 { margin: 0 0 10px; font: 600 clamp(24px, 3.5vw, 34px)/1.4 'Noto Serif JP', serif; }
  .sub { margin: 0 0 30px; font: 400 13px/1.9 'Noto Sans JP', sans-serif; color: rgba(244,244,245,.84); }
  label { display: block; margin: 22px 0 8px; font: 500 12px 'Noto Sans JP', sans-serif; letter-spacing: .1em; color: rgba(244,244,245,.88); }
  .hint { font-weight: 300; color: rgba(244,244,245,.78); letter-spacing: 0; }
  input, select { width: 100%; font: 400 14px 'Noto Sans JP', sans-serif; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: #0c0c11; color: #f4f4f5; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .drop { margin-top: 8px; padding: 34px 20px; border: 1.5px dashed rgba(255,255,255,.24); border-radius: 14px; background: #0a0a0e; text-align: center; cursor: pointer; transition: border-color .2s ease, background .2s ease; }
  .drop.over { border-color: var(--accent); background: #0d0d16; }
  .drop p { margin: 6px 0 0; font: 400 12.5px 'Noto Sans JP', sans-serif; color: rgba(244,244,245,.84); }
  .drop .pick { font: 500 14px 'Noto Sans JP', sans-serif; color: #f4f4f5; }
  /* 選んだファイルの一覧 */
  .files { list-style: none; margin: 12px 0 0; padding: 0; }
  .files li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-top: 8px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: #0a0a0e; }
  .files .nm { flex: 1 1 auto; min-width: 0; font: 400 13px 'Noto Sans JP', sans-serif; word-break: break-all; }
  .files .sz { flex: none; font: 400 12px 'Noto Sans JP', sans-serif; color: rgba(244,244,245,.6); }
  .files .rm { flex: none; padding: 4px 10px; font-size: 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: none; color: rgba(244,244,245,.8); cursor: pointer; }
  .files .rm:hover { background: rgba(255,255,255,.07); }
  .files .st { flex: none; font-size: 12px; color: var(--accent-text); }
  .total { margin: 12px 0 0; font: 400 12.5px 'Noto Sans JP', sans-serif; color: rgba(244,244,245,.72); }
  /* 送る前に整える */
  .tools { margin-top: 14px; padding: 14px 16px; border: 1px solid rgba(111,140,255,.28); border-left: 2px solid var(--accent); border-radius: 12px; background: linear-gradient(150deg, rgba(111,140,255,.09), rgba(111,140,255,.02)); }
  .tools-t { margin: 0 0 10px; font: 500 12px 'Noto Sans JP', sans-serif; letter-spacing: .06em; color: rgba(244,244,245,.9); }
  .tools-b { display: flex; gap: 8px; flex-wrap: wrap; }
  .tbtn { padding: 8px 16px; font: 400 12.5px 'Noto Sans JP', sans-serif; border-radius: 999px; border: 1px solid rgba(111,140,255,.5); background: none; color: var(--accent-text); cursor: pointer; }
  .tbtn:hover { background: rgba(111,140,255,.14); opacity: 1; }
  .tbtn:disabled { opacity: .4; cursor: default; }
  .tools-m { margin: 10px 0 0; font: 400 12px/1.8 'Noto Sans JP', sans-serif; color: rgba(244,244,245,.8); }
  .tools-m.err { color: #ffb3b3; } .tools-m.ok { color: #86efac; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 26px; }
  button { font: 400 14px 'Noto Sans JP', sans-serif; letter-spacing: .06em; padding: 12px 28px; border-radius: 999px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #060608; transition: opacity .2s ease; }
  button:hover { opacity: .88; }
  button:disabled { opacity: .4; cursor: default; }
  .bar { margin-top: 20px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; display: none; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
  .msg { margin: 14px 0 0; font: 400 13px 'Noto Sans JP', sans-serif; min-height: 20px; }
  .msg.err { color: #ffb3b3; } .msg.ok { color: #86efac; } .msg.info { color: rgba(244,244,245,.84); }
  .result { display: none; margin-top: 26px; padding: 20px; border: 1px solid rgba(111,140,255,.4); border-radius: 14px; background: #0b0b12; }
  .result .u { display: flex; gap: 10px; margin-top: 10px; }
  .result input { font-size: 13px; }
  .result .note { margin: 14px 0 0; font: 400 12px/1.8 'Noto Sans JP', sans-serif; color: rgba(244,244,245,.84); }
  .back { display: inline-block; margin-top: 40px; font: 400 12.5px 'Noto Sans JP', sans-serif; color: rgba(244,244,245,.84); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">File Share — ファイル共有</p>
  <h1>ファイルを送る</h1>
  <p class="sub">合言葉を入れてファイルを選ぶと、共有用のダウンロードURLが作られます。1ファイル最大5GB、まとめて30個まで。期限が来たら自動で消えます。</p>

  <label>アップロード用の合言葉 <span class="hint">（船越から共有された合言葉）</span></label>
  <input id="code" type="password" autocomplete="off" placeholder="合言葉">

  <label>ファイル <span class="hint">（複数まとめて選べます）</span></label>
  <div id="drop" class="drop">
    <span class="pick">ここにドラッグ、またはクリックして選択</span>
    <p>1ファイル最大 5GB ／ 30個まで</p>
  </div>
  <input id="file" type="file" multiple style="display:none">
  <ul id="files" class="files"></ul>
  <p id="total" class="total"></p>

  <!-- 選んだ中身に応じて出る整えボタン。PDFが2つ以上あればまとめる、
       画像があれば webp にして軽くする。処理はこの端末の中だけで行う。 -->
  <div id="tools" class="tools" hidden>
    <p class="tools-t">送る前に整える <span class="hint">（この端末の中だけで処理します）</span></p>
    <div class="tools-b">
      <button id="t-merge" type="button" class="tbtn" hidden>PDFを1つにまとめる</button>
      <button id="t-i2p" type="button" class="tbtn" hidden>画像を1つのPDFにまとめる</button>
      <button id="t-webp" type="button" class="tbtn" hidden>画像を軽くする（webp）</button>
    </div>
    <p id="t-msg" class="tools-m"></p>
  </div>

  <label>有効期限</label>
  <select id="expiry">
    <option value="1">1日で消える</option>
    <option value="3">3日で消える</option>
    <option value="7" selected>7日で消える</option>
    <option value="30">30日で消える</option>
  </select>

  <label>ダウンロード合言葉 <span class="hint">（任意・ダウンロードする人に必要）</span></label>
  <input id="dlpw" type="text" autocomplete="off" placeholder="空ならURLだけでダウンロード可">

  <div class="row">
    <button id="btn-up" type="button">アップロード</button>
  </div>

  <div id="bar" class="bar"><i id="bar-i"></i></div>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>

  <div id="result" class="result">
    <span style="font:500 12px 'Noto Sans JP',sans-serif; letter-spacing:.1em; color: rgba(244,244,245,.88)">共有URL</span>
    <div class="u">
      <input id="rurl" type="text" readonly>
      <button id="copy" type="button" style="padding:12px 18px">コピー</button>
    </div>
    <p id="rnote" class="note"></p>
  </div>

  <!-- ここへは Works の道具一覧から来る。ホームに飛ばすと戻り道を見失う -->
  <a href="/works.html" class="back">← 道具の一覧へ戻る</a>
  <a href="/tools/" class="back" style="margin-left:20px">ファイル編集ツール →</a>
</div>

<!-- PDFをまとめる／画像を webp にする処理（/tools/ と共通）。
     重いPDFの部品は、実際にPDFの操作を押したときだけ読み込まれる。 -->
<script src="/tools/tools.js"></script>
<script>
(function () {
  var WORKER_URL = 'https://funasun-files.takakouseitokai.workers.dev';
  var MAX_FILES = 30;
  // 1ファイルの上限。Worker 側（files-worker/worker.js の MAX_GB）と同じ数にしておく
  var MAX_GB = 5;
  var MAX_BYTES = MAX_GB * 1024 * 1024 * 1024;

  var $ = function (id) { return document.getElementById(id); };
  var fileInput = $('file');
  var drop = $('drop');
  var msg = $('msg');
  var bar = $('bar');
  var barI = $('bar-i');
  var btn = $('btn-up');
  var chosen = [];   // 選ばれたファイルたち

  function setMsg(t, c) { msg.textContent = t; msg.className = 'msg' + (c ? ' ' + c : ''); }
  function humanSize(n) {
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return n.toFixed(n >= 10 || i === 0 ? 0 : 1) + ' ' + u[i];
  }
  async function sha256hex(s) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function randomId() {
    var a = new Uint8Array(12);
    crypto.getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  // 一覧を描き直す。名前は textContent で入れるので、変なファイル名でも安全。
  function renderList() {
    var ul = $('files');
    ul.innerHTML = '';
    chosen.forEach(function (f, i) {
      var li = document.createElement('li');
      var nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = f.name;
      var sz = document.createElement('span');
      sz.className = 'sz'; sz.textContent = humanSize(f.size);
      var rm = document.createElement('button');
      rm.className = 'rm'; rm.type = 'button'; rm.textContent = '外す';
      rm.addEventListener('click', function () { chosen.splice(i, 1); renderList(); });
      li.appendChild(nm); li.appendChild(sz); li.appendChild(rm);
      ul.appendChild(li);
    });
    var total = chosen.reduce(function (s, f) { return s + f.size; }, 0);
    $('total').textContent = chosen.length
      ? chosen.length + '個 ／ 合計 ' + humanSize(total)
      : '';
    updateTools();
  }

  /* 選んだ中身を見て、役に立つ整えボタンだけを出す。
     いつも全部並べると、関係ない人には邪魔なので出しっぱなしにしない。 */
  function updateTools() {
    var T = window.FileTools;
    if (!T) { $('tools').hidden = true; return; }
    var pdfs = chosen.filter(T.isPdf);
    var imgs = chosen.filter(function (f) { return T.isImage(f) && !/\.webp$/i.test(f.name); });
    // webp にしたものも「PDFにまとめる」対象。軽くしてから1冊にできるように
    var allImgs = chosen.filter(T.isImage);
    $('t-merge').hidden = pdfs.length < 2;
    $('t-i2p').hidden = allImgs.length < 1;
    $('t-webp').hidden = imgs.length < 1;
    $('tools').hidden = $('t-merge').hidden && $('t-webp').hidden && $('t-i2p').hidden;
    if ($('tools').hidden) setToolMsg('');
  }
  function setToolMsg(t, c) {
    $('t-msg').textContent = t || '';
    $('t-msg').className = 'tools-m' + (c ? ' ' + c : '');
  }
  function toolsBusy(on) {
    $('t-merge').disabled = on; $('t-webp').disabled = on; $('t-i2p').disabled = on; btn.disabled = on;
  }

  // 同じファイルを二重に足さない（名前＋サイズ＋更新日時で見分ける）
  function addFiles(list) {
    var added = 0, tooBig = 0;
    for (var i = 0; i < list.length; i++) {
      var f = list[i];
      if (f.size > MAX_BYTES) { tooBig++; continue; }
      if (chosen.length >= MAX_FILES) break;
      var dup = chosen.some(function (c) {
        return c.name === f.name && c.size === f.size && c.lastModified === f.lastModified;
      });
      if (dup) continue;
      chosen.push(f); added++;
    }
    renderList();
    if (tooBig) setMsg(tooBig + '個のファイルは大きすぎるため外しました（1ファイル上限' + MAX_GB + 'GB）。', 'err');
    else if (chosen.length >= MAX_FILES) setMsg('一度に送れるのは' + MAX_FILES + '個までです。', 'info');
    else if (added) setMsg('', '');
  }

  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    addFiles(fileInput.files);
    fileInput.value = '';   // 同じファイルを選び直せるように毎回空にする
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });

  /* --- PDFを1つにまとめる --- */
  $('t-merge').addEventListener('click', function () {
    var T = window.FileTools;
    var pdfs = chosen.filter(T.isPdf);
    if (pdfs.length < 2) return;
    toolsBusy(true);
    setToolMsg('まとめています…（' + pdfs.length + '個）');
    T.mergePdf(pdfs, function (done, total, name) {
      setToolMsg('まとめています… ' + done + ' / ' + total + (name ? '（' + name + '）' : ''));
    }).then(function (blob) {
      var name = T.baseName(pdfs[0].name) + '_まとめ.pdf';
      // まとめた元のPDFは一覧から外し、代わりに1つ入れる
      chosen = chosen.filter(function (f) { return !T.isPdf(f); });
      chosen.unshift(T.toFile(blob, name));
      renderList();
      setToolMsg(pdfs.length + '個のPDFを「' + name + '」にまとめました。', 'ok');
      toolsBusy(false);
    }).catch(function (e) {
      setToolMsg(e.message, 'err');
      toolsBusy(false);
    });
  });

  /* --- 画像を1つのPDFにまとめる ---
     写真を何枚も送るより、1冊のPDFにした方が相手が見やすい。
     並びは一覧に出ている順のまま。 */
  $('t-i2p').addEventListener('click', function () {
    var T = window.FileTools;
    var imgs = chosen.filter(T.isImage);
    if (!imgs.length) return;
    toolsBusy(true);
    setToolMsg('PDFにしています…（' + imgs.length + '枚）');
    T.imagesToPdf(imgs, { size: 'fit', margin: 0 }, function (done, total, name) {
      setToolMsg('PDFにしています… ' + done + ' / ' + total + (name ? '（' + name + '）' : ''));
    }).then(function (blob) {
      var name = T.baseName(imgs[0].name) + '_まとめ.pdf';
      // 元の画像は一覧から外し、代わりにPDFを1つ入れる
      chosen = chosen.filter(function (f) { return !T.isImage(f); });
      chosen.unshift(T.toFile(blob, name));
      renderList();
      setToolMsg(imgs.length + '枚の画像を「' + name + '」にまとめました。', 'ok');
      toolsBusy(false);
    }).catch(function (e) {
      setToolMsg(e.message, 'err');
      toolsBusy(false);
    });
  });

  /* --- 画像を webp にして軽くする --- */
  $('t-webp').addEventListener('click', function () {
    var T = window.FileTools;
    var imgs = chosen.filter(function (f) { return T.isImage(f) && !/\.webp$/i.test(f.name); });
    if (!imgs.length) return;
    toolsBusy(true);

    var before = 0, after = 0, failed = [];
    imgs.reduce(function (chain, f, i) {
      return chain.then(function () {
        setToolMsg('変換中… ' + (i + 1) + ' / ' + imgs.length + '（' + f.name + '）');
        return T.toWebp(f, { maxEdge: 1800, quality: 0.82 }).then(function (r) {
          var at = chosen.indexOf(f);
          if (at !== -1) chosen[at] = T.toFile(r.blob, r.name);
          before += r.before; after += r.after;
        }).catch(function (e) { failed.push(e.message); });
      });
    }, Promise.resolve()).then(function () {
      renderList();
      toolsBusy(false);
      if (before) {
        var pct = Math.round((1 - after / before) * 100);
        setToolMsg('画像を webp にしました。' + humanSize(before) + ' → ' + humanSize(after)
          + (pct > 0 ? '（' + pct + '%減）' : '')
          + (failed.length ? ' ／ ' + failed.length + '個は変換できませんでした：' + failed[0] : ''),
          failed.length ? '' : 'ok');
      } else {
        setToolMsg(failed[0] || '変換できませんでした。', 'err');
      }
    });
  });

  // 1つ分のアップロード。done は全体の進捗表示に使う。
  async function uploadOne(file, opts) {
    var res = await fetch(WORKER_URL + '/create', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code: opts.code, filename: file.name, size: file.size,
        contentType: file.type || 'application/octet-stream',
        expiryDays: opts.days, pwHash: opts.pwHash,
        group: opts.group, index: opts.index
      })
    });
    var cj = await res.json();
    if (!res.ok) throw new Error('「' + file.name + '」' + (cj.message || 'アップロードを開始できませんでした'));

    var partSize = cj.partSize;
    var shareUrl = '';
    for (var offset = 0; offset < file.size; offset += partSize) {
      var end = Math.min(offset + partSize, file.size);
      var pr = await fetch(WORKER_URL + '/part?session=' + encodeURIComponent(cj.sessionUri) +
        '&start=' + offset + '&end=' + end + '&total=' + file.size, {
        method: 'PUT', body: file.slice(offset, end)
      });
      var pj = await pr.json();
      if (!pr.ok) throw new Error('「' + file.name + '」' + (pj.message || 'アップロード中にエラーが発生しました'));
      if (pj.done) shareUrl = pj.url;
      opts.onProgress(end - offset);
    }
    if (!shareUrl) throw new Error('「' + file.name + '」の保存を確定できませんでした');
    return shareUrl;
  }

  btn.addEventListener('click', async function () {
    var code = $('code').value.trim();
    if (!code) { setMsg('アップロード用の合言葉を入力してください。', 'err'); return; }
    if (!chosen.length) { setMsg('ファイルを選んでください。', 'err'); return; }

    var files = chosen.slice();
    var grandTotal = files.reduce(function (s, f) { return s + f.size; }, 0);
    var sent = 0;

    btn.disabled = true;
    $('result').style.display = 'none';
    bar.style.display = 'block';
    barI.style.width = '0%';
    setMsg('準備中…', 'info');

    try {
      var pwHash = '';
      if ($('dlpw').value) pwHash = await sha256hex($('dlpw').value);
      // 2個以上なら「まとめID」を作り、1つのURLで渡せるようにする
      var group = files.length > 1 ? randomId() : '';
      var lastUrl = '';

      for (var i = 0; i < files.length; i++) {
        setMsg('アップロード中… ' + (i + 1) + '/' + files.length + '「' + files[i].name + '」', 'info');
        lastUrl = await uploadOne(files[i], {
          code: code, days: Number($('expiry').value), pwHash: pwHash,
          group: group, index: i,
          onProgress: function (n) {
            sent += n;
            var pct = Math.min(100, Math.round(sent / grandTotal * 100));
            barI.style.width = pct + '%';
          }
        });
      }

      var shareUrl = group ? WORKER_URL + '/g/' + group : lastUrl;
      var expText = $('expiry').selectedOptions[0].text;
      setMsg('完了しました。', 'ok');
      $('rurl').value = shareUrl;
      $('rnote').textContent =
        (group ? files.length + '個のファイルが1つのURLにまとまりました。' : '')
        + ($('dlpw').value
          ? 'この URL と「ダウンロード合言葉」を相手に伝えてください。'
          : 'この URL を相手に伝えてください。')
        + expText + '。';
      $('result').style.display = 'block';
      chosen = []; renderList();
    } catch (e) {
      setMsg(e.message || '失敗しました。もう一度お試しください。', 'err');
    } finally {
      btn.disabled = false;
      setTimeout(function () { bar.style.display = 'none'; }, 800);
    }
  });

  $('copy').addEventListener('click', function () {
    $('rurl').select();
    try { navigator.clipboard.writeText($('rurl').value); } catch (e) { document.execCommand('copy'); }
    $('copy').textContent = 'コピー済';
    setTimeout(function () { $('copy').textContent = 'コピー'; }, 1500);
  });
})();
</script>
</body>
</html>
